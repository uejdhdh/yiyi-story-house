<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FAF6EF" />
<meta name="description" content="写一个开头，依依老师把它变成一本三幕小绘本。儿童写作启蒙 · AI 引导 · 一键成书。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%B8%3C/text%3E%3C/svg%3E" />
<title>依依故事屋 · 小小的想法，大大的故事</title>
<style>
  :root {
    --bg: #FAF6EF;
    --surface: #FFFFFF;
    --paper: #FDFAF4;
    --ink: #3D342B;
    --ink-2: #7A7166;
    --ink-3: #A79D8F;
    --line: #ECE4D6;
    --line-strong: #E0D5C2;
    --primary: #F4623A;
    --primary-deep: #D84E28;
    --primary-tint: #FDEFE9;
    --primary-ring: rgba(244, 98, 58, .16);
    --amber: #F5A623;
    --amber-tint: #FEF4E0;
    --teal: #2F9E77;
    --teal-deep: #237A5D;
    --blue: #4E8FD9;
    --rose: #E5628B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--ink); letter-spacing: .2px; overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(640px 400px at 88% -6%, rgba(245,166,35,.10), transparent 62%),
                radial-gradient(720px 460px at -12% 26%, rgba(244,98,58,.06), transparent 62%),
                radial-gradient(640px 420px at 55% 112%, rgba(78,143,217,.06), transparent 62%);
  }
  ::selection { background: #FBE3D8; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 8px; }

  @keyframes fadeup { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  .fadeup { animation: fadeup .4s ease both; }
  @keyframes floaty { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  .hidden { display: none !important; }
  .view { display: none; }

  /* ================= 顶栏 ================= */
  .topbar { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 20px; background: rgba(255,255,255,.82); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-logo { width: 38px; height: 38px; border-radius: 12px; background: var(--primary-tint);
    display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .brand-logo svg { width: 30px; height: 32px; display: block; }
  .brand-name { font-size: 17px; font-weight: 900; color: var(--ink); letter-spacing: 1px; white-space: nowrap; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .engpill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
    color: var(--ink-3); background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 12px; cursor: pointer; font-family: inherit; }
  .engpill i { width: 7px; height: 7px; border-radius: 99px; background: var(--ink-3); }
  .engpill.ok { color: var(--teal); border-color: #CFE9DD; } .engpill.ok i { background: var(--teal); }
  .engpill.off { color: var(--ink-3); } .engpill.off i { background: #C9BFB0; }
  .engpill.wait { color: var(--amber); border-color: #F3E3C3; } .engpill.wait i { background: var(--amber); animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .25 } }
  .btn-ghost { display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--line);
    color: var(--ink-2); font-size: 13.5px; font-weight: 700; border-radius: 999px; padding: 8px 16px;
    cursor: pointer; font-family: inherit; transition: border-color .15s, color .15s, background .15s; }
  .btn-ghost:hover { border-color: var(--line-strong); color: var(--ink); background: #fff; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 18px 64px; }

  /* ================= 首页 Hero ================= */
  .hero { text-align: center; padding: 18px 0 6px; }
  .hero .mascot-hero { width: 108px; height: 116px; margin: 0 auto; display: block; animation: floaty 3.4s ease-in-out infinite; }
  h1 { font-size: clamp(30px, 6.4vw, 42px); font-weight: 900; letter-spacing: 3px; margin-top: 12px; color: var(--ink); }
  h1 em { font-style: normal; background: linear-gradient(transparent 70%, #FFDF9B 70%); padding: 0 2px; }
  .tagline { margin-top: 10px; font-size: 15.5px; color: var(--ink-2); font-weight: 600; }

  /* ================= 步骤指示 ================= */
  .steps { display: flex; align-items: center; justify-content: center; gap: 0; margin: 22px 0 20px; }
  .step { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: var(--ink-3); }
  .step i { font-style: normal; width: 22px; height: 22px; border-radius: 99px; background: #F0E9DC; color: var(--ink-3);
    font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .step.cur { color: var(--primary); }
  .step.cur i { background: var(--primary); color: #fff; }
  .step.done { color: var(--teal); }
  .step.done i { background: var(--teal); color: #fff; }
  .sline { width: 34px; height: 1px; background: var(--line-strong); margin: 0 10px; }

  /* ================= 面板 ================= */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 24px;
    box-shadow: 0 1px 2px rgba(61,52,43,.04), 0 16px 40px rgba(61,52,43,.07); }
  .panel-pad { padding: 26px 26px 26px; }
  .label { font-size: 13px; font-weight: 800; color: var(--ink-3); letter-spacing: 1px; margin-bottom: 10px; }

  textarea#opening { width: 100%; min-height: 108px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--paper); font-size: clamp(17px, 3.6vw, 20px); font-weight: 600; color: var(--ink);
    padding: 16px 18px; font-family: inherit; line-height: 1.8; resize: none; outline: none;
    transition: border-color .18s, background .18s, box-shadow .18s; }
  textarea#opening:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px var(--primary-ring); }
  textarea#opening::placeholder { color: #C4BAA9; font-weight: 500; }
  .field-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 13px; color: var(--ink-3); margin-top: 10px; font-weight: 600; }
  .field-meta b { color: var(--primary); font-weight: 800; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip { background: transparent; border: 1px solid var(--line); color: var(--ink-2); border-radius: 999px;
    padding: 8px 15px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit;
    transition: border-color .15s, color .15s, background .15s; }
  .chip:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-tint); }
  .draftnote { text-align: center; font-size: 12px; color: #9FB8A9; font-weight: 700; margin-top: 12px; }

  /* ================= 按钮 ================= */
  .btn-primary { display: block; width: 100%; margin-top: 22px; padding: 16px 22px; font-size: 17.5px; font-weight: 900;
    font-family: inherit; letter-spacing: 2px; color: #fff; background: var(--primary); border: none; border-radius: 999px;
    cursor: pointer; box-shadow: 0 10px 22px rgba(244,98,58,.30); transition: transform .15s, box-shadow .15s, background .15s, filter .15s; }
  .btn-primary:hover { background: #F86E48; transform: translateY(-1px); box-shadow: 0 12px 26px rgba(244,98,58,.34); }
  .btn-primary:active { transform: translateY(1px); box-shadow: 0 5px 14px rgba(244,98,58,.30); }
  .btn-primary:disabled { background: #E9E2D6; box-shadow: none; cursor: not-allowed; color: #B0A797; transform: none; }
  .btn-primary.green { background: var(--teal); box-shadow: 0 10px 22px rgba(47,158,119,.30); }
  .btn-primary.green:hover { background: #33AA83; }
  .btn-primary.green:disabled { background: #E9E2D6; box-shadow: none; color: #B0A797; }
  .btn-primary.slim { display: inline-block; width: auto; padding: 13px 24px; font-size: 15.5px; margin-top: 0; letter-spacing: 1px; }
  .btn-soft { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--line);
    color: var(--ink-2); font-size: 13.5px; font-weight: 700; border-radius: 999px; padding: 8px 14px;
    cursor: pointer; font-family: inherit; transition: border-color .15s, color .15s, transform .15s; }
  .btn-soft:hover { border-color: var(--line-strong); color: var(--ink); transform: translateY(-1px); }
  .btn-soft.accent { color: var(--blue); border-color: #D9E6F5; }
  .btn-soft.accent:hover { border-color: var(--blue); }

  /* ================= 进度 ================= */
  .progress { margin-bottom: 18px; }
  .progress-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    font-size: 13px; font-weight: 800; color: var(--ink-2); }
  .progress-meta .actname { color: var(--primary); }
  .progress-track { height: 6px; border-radius: 999px; background: #F0E9DC; overflow: hidden; }
  .progress-track i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #F8875F, var(--primary));
    transition: width .5s cubic-bezier(.4,0,.2,1); }

  /* ================= 回顾条 ================= */
  .recap { background: var(--paper); border: 1px solid var(--line); border-left: 3px solid var(--amber);
    border-radius: 12px; padding: 10px 14px; font-size: 13px; color: var(--ink-2); font-weight: 600;
    line-height: 1.8; margin-bottom: 18px; }
  .recap b { color: var(--amber); font-weight: 800; margin-right: 4px; }

  /* ================= 问答 ================= */
  .ask { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 18px; }
  .ask-avatar { flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; background: #fff;
    border: 1px solid var(--line); box-shadow: 0 4px 12px rgba(61,52,43,.08); display: flex; align-items: center;
    justify-content: center; }
  .ask-avatar svg { width: 42px; height: 45px; display: block; }
  .ask-bubble { position: relative; flex: 1; background: #fff; border: 1px solid var(--line); border-radius: 4px 18px 18px 18px;
    padding: 16px 18px; box-shadow: 0 1px 2px rgba(61,52,43,.04), 0 10px 24px rgba(61,52,43,.06); }
  .ask-bubble .q { display: block; font-size: clamp(19px, 3.8vw, 22px); font-weight: 800; color: var(--ink); line-height: 1.6; }
  .ask-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .choices { display: grid; gap: 10px; }
  .choice { display: flex; align-items: center; gap: 13px; width: 100%; text-align: left; background: #fff;
    border: 1px solid var(--line); border-radius: 16px; font-size: clamp(16px, 3.2vw, 19px); font-weight: 700;
    color: var(--ink); padding: 14px 16px; cursor: pointer; font-family: inherit;
    box-shadow: 0 1px 2px rgba(61,52,43,.04); transition: border-color .15s, box-shadow .15s, transform .15s, background .15s;
    animation: fadeup .4s ease both; }
  .choice:hover { border-color: #F0BCA6; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(61,52,43,.08); }
  .choice .key { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 12px; background: var(--primary-tint);
    color: var(--primary); font-size: 15px; font-weight: 900; display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s; }
  .choice .check { margin-left: auto; flex: 0 0 auto; width: 24px; height: 24px; border-radius: 99px; background: var(--primary);
    color: #fff; font-size: 13px; font-weight: 900; display: none; align-items: center; justify-content: center; }
  .choice.sel { border-color: var(--primary); background: #FFF9F6; box-shadow: 0 0 0 1px var(--primary), 0 8px 18px rgba(244,98,58,.12); }
  .choice.sel .key { background: var(--primary); color: #fff; }
  .choice.sel .check { display: flex; }
  .customrow { display: flex; gap: 10px; margin-top: 4px; align-items: stretch; }
  .customrow input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--paper); border-radius: 14px;
    font-size: 17px; font-weight: 600; color: var(--ink); padding: 13px 16px; font-family: inherit; outline: none;
    transition: border-color .18s, box-shadow .18s, background .18s; }
  .customrow input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px var(--primary-ring); }

  /* ================= 生成中 ================= */
  .making { text-align: center; padding: 64px 24px 56px; }
  .making .mascot-making { width: 88px; height: 95px; margin: 0 auto; display: block; animation: floaty 2.6s ease-in-out infinite; }
  .making-title { font-size: 20px; font-weight: 900; color: var(--ink); margin-top: 20px; }
  .making-tip { font-size: 14px; color: var(--ink-3); margin-top: 8px; font-weight: 600; min-height: 22px; }
  .making .bar { width: min(240px, 60%); height: 4px; margin: 22px auto 0; border-radius: 999px; background: #F0E9DC; overflow: hidden; }
  .making .bar i { display: block; width: 36%; height: 100%; border-radius: 999px; background: var(--primary); animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-110%) } to { transform: translateX(320%) } }
  .making-choice { display: inline-block; margin-top: 16px; background: var(--paper); border: 1px solid var(--line);
    color: var(--ink-2); font-size: 13px; font-weight: 600; border-radius: 999px; padding: 7px 14px; }

  /* ================= 每一幕（故事页） ================= */
  .actpage { overflow: hidden; }
  .act-art { margin: 18px 18px 0; border-radius: 16px; overflow: hidden; border: 1px solid var(--line);
    box-shadow: 0 10px 26px rgba(61,52,43,.10); }
  .art { position: relative; overflow: hidden; background: linear-gradient(160deg, #FBF3E4, #F7E8DC);
    aspect-ratio: 16 / 9; }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; animation: kenburns 18s ease-in-out infinite alternate; }
  @keyframes kenburns { from { transform: scale(1) } to { transform: scale(1.07) translate(-6px, -4px) } }
  .art-fallback::before { content: "🎨"; position: absolute; top: 50%; left: 50%; font-size: 46px;
    transform: translate(-50%, -50%); opacity: .45; }
  .art-loading { display: flex; align-items: center; justify-content: center; }
  .art-loading-inner { font-size: 15px; font-weight: 700; color: var(--ink-3); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .5 } 50% { opacity: 1 } }
  .act-body { padding: 20px 22px 24px; }
  .act-tag { display: inline-flex; align-items: center; gap: 8px; background: var(--primary-tint); color: var(--primary);
    font-size: 13px; font-weight: 800; border-radius: 999px; padding: 6px 14px; letter-spacing: 1px; }
  .act-tag i { font-style: normal; width: 6px; height: 6px; border-radius: 99px; background: var(--primary); }
  .storytext { margin-top: 14px; font-size: clamp(18px, 3.6vw, 21px); line-height: 2.05; font-weight: 600; color: var(--ink); }
  mark.hl-gem { background: linear-gradient(transparent 62%, #FFDF9B 62%); color: inherit; padding: 0 2px; border-radius: 3px; font-weight: 800; }
  mark.hl-choice { background: linear-gradient(transparent 70%, #FFD3C4 70%); color: inherit; padding: 0 2px; border-radius: 3px; font-weight: 700; }
  .act-next { display: flex; align-items: center; gap: 8px; margin-top: 16px; padding-top: 14px;
    border-top: 1px dashed var(--line); font-size: 13.5px; color: var(--ink-3); font-weight: 700; }
  .act-next i { font-style: normal; color: var(--primary); font-weight: 900; }
  .act-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

  /* ================= 绘本 ================= */
  .bookbar { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 18px; flex-wrap: wrap; gap: 10px; }
  .bookbar h2 { font-size: 21px; color: var(--ink); font-weight: 900; letter-spacing: 1px; }
  .btns { display: flex; gap: 8px; }
  .btn-tool { display: inline-flex; align-items: center; gap: 6px; border: none; cursor: pointer; font-family: inherit;
    font-weight: 800; font-size: 13.5px; border-radius: 999px; padding: 10px 18px; transition: transform .12s, filter .15s; }
  .btn-tool:hover { transform: translateY(-1px); filter: brightness(1.04); }
  .btn-tool:active { transform: translateY(1px); }
  .btn-tool.print { background: var(--teal); color: #fff; box-shadow: 0 6px 14px rgba(47,158,119,.28); }
  .btn-tool.plain { background: #fff; color: var(--ink-2); border: 1px solid var(--line); box-shadow: none; }
  .btn-tool.plain:hover { border-color: var(--line-strong); color: var(--ink); }
  .bookstage { position: relative; }
  .bookcard { background: var(--surface); border: 1px solid var(--line); border-radius: 24px;
    box-shadow: 0 1px 2px rgba(61,52,43,.05), 0 24px 56px rgba(61,52,43,.12); overflow: hidden; position: relative; }
  .turnL { animation: turnL .5s ease both; }
  .turnR { animation: turnR .5s ease both; }
  @keyframes turnL { from { transform: perspective(1200px) rotateY(-12deg); opacity: .4 } to { transform: none; opacity: 1 } }
  @keyframes turnR { from { transform: perspective(1200px) rotateY(12deg); opacity: .4 } to { transform: none; opacity: 1 } }

  .bk-cover { position: relative; background: var(--paper); min-height: 540px; display: flex; align-items: center; justify-content: center; }
  .bk-cover .frame { position: absolute; inset: 14px; border: 1px solid var(--line-strong); border-radius: 18px; pointer-events: none; }
  .bk-cover .frame::before { content: ""; position: absolute; inset: 6px; border: 1px dashed #E8DCC4; border-radius: 13px; }
  .bk-inner { position: relative; padding: 44px 32px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .bk-ribbon { background: var(--primary-tint); color: var(--primary); border-radius: 999px; font-size: 12.5px;
    font-weight: 800; padding: 6px 16px; letter-spacing: 2px; }
  .medallion { width: 96px; height: 96px; margin-top: 18px; border-radius: 50%; background: #fff;
    border: 1px solid var(--line); box-shadow: 0 10px 22px rgba(61,52,43,.10); display: flex; align-items: center; justify-content: center; }
  .medallion svg { width: 70px; height: 76px; }
  .bk-title { font-size: clamp(28px, 6.4vw, 40px); font-weight: 900; color: var(--ink); margin-top: 16px; letter-spacing: 2px;
    background: linear-gradient(transparent 72%, #FFDF9B 72%); padding: 0 4px; }
  .bk-art { width: min(230px, 60%); margin-top: 16px; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--line); box-shadow: 0 10px 22px rgba(61,52,43,.12); }
  .bk-art.big { width: 100%; margin-top: 0; }
  .bk-art .art { border: none; border-radius: 0; box-shadow: none; }
  .bk-date { margin-top: 16px; font-size: 13px; color: var(--ink-3); font-weight: 600; }
  .bk-author { margin-top: 4px; font-size: 16px; color: var(--ink); font-weight: 800; letter-spacing: 2px; }
  .agebadge { margin-top: 12px; background: #fff; border: 1px solid var(--line); color: var(--ink-2); font-size: 12px;
    font-weight: 800; padding: 6px 14px; border-radius: 999px; letter-spacing: 1px; }
  .bk-content { position: relative; min-height: 540px; padding: 22px 22px 40px; display: flex; flex-direction: column; gap: 16px; }
  .bk-content .storytext { flex: 1; display: flex; align-items: center; font-size: clamp(19px, 4vw, 23px); line-height: 2; }
  .storytext .stext { display: block; width: 100%; }
  .pageno { position: absolute; right: 16px; bottom: 12px; background: var(--paper); border: 1px solid var(--line);
    color: var(--ink-3); font-size: 12px; font-weight: 800; border-radius: 999px; padding: 4px 12px; }
  .bk-back { position: relative; background: var(--paper); min-height: 540px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 30px; }
  .bk-stars { font-size: 34px; letter-spacing: 12px; color: var(--amber); }
  .praise { font-size: clamp(20px, 4vw, 25px); font-weight: 800; color: var(--ink); margin-top: 18px;
    text-align: center; line-height: 1.8; max-width: 26em; }
  .bk-sign { margin-top: 14px; font-size: 14px; color: var(--ink-3); font-weight: 700; }
  .publisher { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; font-size: 11px;
    letter-spacing: 3px; color: #C6BBAA; font-weight: 700; }
  .booknav { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 18px; }
  .navbtn { width: 46px; height: 46px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; font-size: 18px;
    background: #fff; color: var(--ink-2); font-family: inherit; box-shadow: 0 2px 8px rgba(61,52,43,.07);
    transition: transform .12s, border-color .15s, color .15s; }
  .navbtn:hover { border-color: var(--primary); color: var(--primary); }
  .navbtn:active { transform: translateY(2px); }
  .navbtn:disabled { opacity: .35; cursor: default; pointer-events: none; }
  .dots { display: flex; gap: 7px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 999px; border: none; background: #E3D9C8; cursor: pointer; padding: 0;
    transition: transform .15s, background .15s; }
  .dot.on { background: var(--primary); transform: scale(1.35); }
  .pageinfo { font-size: 13px; font-weight: 800; color: var(--ink-3); min-width: 48px; text-align: center; }

  /* ================= 好词好句 ================= */
  .words-panel { margin-top: 20px; }
  .words-pad { padding: 22px 22px 18px; }
  .words-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .words-title { font-size: 17px; font-weight: 900; color: var(--ink); }
  .words-sub { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
  .words-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .wordcard { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; text-align: left;
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
    cursor: pointer; font-family: inherit; transition: border-color .15s, transform .15s; }
  .wordcard:hover { border-color: var(--amber); transform: translateY(-1px); }
  .w-phrase { font-size: 19px; font-weight: 900; color: var(--ink);
    background: linear-gradient(transparent 70%, #FFDF9B 70%); padding: 0 2px; }
  .w-row { display: flex; align-items: center; gap: 6px; width: 100%; }
  .w-type { font-style: normal; font-size: 11px; font-weight: 800; color: var(--primary);
    background: var(--primary-tint); border-radius: 6px; padding: 2px 7px; }
  .w-emo { font-size: 11.5px; font-weight: 700; color: var(--ink-2); }
  .w-act { font-size: 11px; color: var(--ink-3); font-weight: 700; margin-left: auto; }
  .w-tip { font-size: 12px; color: var(--ink-3); font-weight: 600; line-height: 1.6; }
  .words-foot { margin-top: 14px; font-size: 12px; color: var(--ink-3); font-weight: 600; text-align: center; }
  .words-sheet { padding: 28px; }
  .words-sheet .wordcard { cursor: default; }

  /* ================= 彩带 / 提示 ================= */
  .confetti-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 140; overflow: hidden; }
  .cf { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 3px; opacity: .95;
    animation: fall 2.6s ease-in forwards; }
  @keyframes fall { 0% { transform: translateY(-30px) rotate(0); opacity: 1 } 80% { opacity: 1 } 100% { transform: translateY(105vh) rotate(660deg); opacity: 0 } }
  .errbar { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 120; background: #fff;
    color: #C24A2E; font-weight: 700; border-radius: 12px; padding: 11px 20px; box-shadow: 0 12px 32px rgba(61,52,43,.16);
    border: 1px solid #F3CDBE; animation: fadeup .3s ease both; white-space: nowrap; max-width: 92vw;
    overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  footer { text-align: center; padding: 40px 0 10px; font-size: 12.5px; color: #C0B5A4; font-weight: 600; }
  .footsep { margin: 0 10px; opacity: .6; }

  /* ================= 设置弹窗 ================= */
  .modal { position: fixed; inset: 0; background: rgba(50,42,34,.4); backdrop-filter: blur(4px); z-index: 150;
    display: flex; align-items: center; justify-content: center; padding: 18px; }
  .box { background: #fff; border-radius: 20px; border: 1px solid var(--line); max-width: 520px; width: 100%;
    padding: 24px 24px 20px; max-height: 88vh; overflow: auto; box-shadow: 0 30px 70px rgba(0,0,0,.25);
    animation: fadeup .3s ease both; }
  .box h3 { font-size: 19px; color: var(--ink); margin-bottom: 4px; }
  .sec-title { font-size: 13px; font-weight: 800; color: var(--ink-3); letter-spacing: 1px; margin: 18px 0 4px; padding-top: 14px; border-top: 1px solid var(--line); }
  .box label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 12px 0 5px; }
  .box input { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 10px;
    font-size: 14px; padding: 10px 12px; font-family: inherit; outline: none; }
  .box input:focus { border-color: var(--primary); }
  .tip { font-size: 12.5px; color: var(--ink-3); line-height: 1.8; background: var(--paper); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; }
  .switchrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px;
    font-weight: 700; color: var(--ink); margin: 10px 0; cursor: pointer; }
  .switchrow span:first-child { flex: 1; }
  .tgl { position: relative; width: 44px; height: 25px; flex: 0 0 auto; }
  .tgl input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; }
  .tgl i { position: absolute; inset: 0; background: #E3DACA; border-radius: 99px; transition: background .2s; pointer-events: none; }
  .tgl i::before { content: ""; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; background: #fff;
    border-radius: 99px; transition: transform .2s; box-shadow: 0 2px 4px rgba(0,0,0,.15); }
  .tgl input:checked + i { background: var(--teal); }
  .tgl input:checked + i::before { transform: translateX(19px); }
  .rowflex { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .connresult { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
  .diag { margin-top: 14px; font-size: 12.5px; color: var(--ink-3); }
  .diag summary { cursor: pointer; font-weight: 700; }
  .diag pre { white-space: pre-wrap; word-break: break-all; background: var(--paper); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; margin-top: 8px; max-height: 110px; overflow: auto; }
  .boxbtns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .btn-solid { display: inline-flex; align-items: center; border: none; cursor: pointer; font-family: inherit;
    font-weight: 800; font-size: 13.5px; border-radius: 999px; padding: 10px 18px; transition: transform .12s, filter .15s; }
  .btn-solid:hover { transform: translateY(-1px); filter: brightness(1.04); }
  .btn-solid.dark { background: var(--ink); color: #fff; }
  .btn-solid.teal { background: var(--teal); color: #fff; }

  /* ================= 依依（吉祥物）动画 ================= */
  .mascot .paw { transform-box: fill-box; transform-origin: 30% 90%; animation: wave 2.6s ease-in-out infinite; }
  @keyframes wave { 0%,100% { transform: rotate(0deg) } 50% { transform: rotate(-16deg) } }

  /* ================= 响应式 / 动效偏好 ================= */
  @media (max-width: 620px) {
    .panel-pad { padding: 20px 16px 22px; }
    .ask { gap: 10px; }
    .ask-avatar { width: 44px; height: 44px; }
    .ask-avatar svg { width: 36px; height: 39px; }
    .act-art { margin: 14px 14px 0; }
    .act-body { padding: 16px 16px 20px; }
    .hero .mascot-hero { width: 92px; height: 99px; }
    .topbar { padding: 10px 14px; }
    .sline { width: 18px; margin: 0 6px; }
    .step { font-size: 12px; }
    .bookcard, .bk-cover, .bk-back, .bk-content { min-height: 460px; }
  }
  @media (prefers-reduced-motion: reduce) {

  }

  /* ================= 打印 ================= */

    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .no-print, .errbar, .confetti-wrap, .bookstage, .bookbar { display: none !important; }
    body { background: #fff !important; }
    body::before { display: none; }
    .topbar { display: none !important; }
    .wrap { max-width: none; padding: 0; }
    .view { display: block !important; }
    .sheet { page-break-after: always; break-inside: avoid; display: flex; align-items: center; justify-content: center; min-height: 262mm; }
    .sheet .bookcard { width: 100%; box-shadow: none; }
    .sheet .bk-cover, .sheet .bk-back, .sheet .bk-content { min-height: 244mm; }
    .storytext { font-size: 16pt; }
  }

<body>
<div id="app"></div>
<noscript><div style="text-align:center;padding:60px 20px;font-size:18px;font-weight:800;">需要启用 JavaScript 才能使用依依故事屋哦 🧸</div></noscript>
<script>
'use strict';

/* ================= AI 层：预置智谱 API > 同源后端 > 本地引擎 ================= */
/* v2：忽略旧版本本地保存的错误模型名，统一小写 */
const AICFG_KEY = 'yiyi-ai-cfg-v6';
const PRESET_CFG = {
  base: 'https://open.bigmodel.cn/api/paas/v4',
  apiKey: '',
  model: 'glm-4-flash',
  imgModel: 'cogview-4',
};
function loadCfg() {
  try {
    const s = JSON.parse(localStorage.getItem(AICFG_KEY) || 'null');
    if (s && s.apiKey && s.apiKey.trim()) {
      return {
        base: s.base || PRESET_CFG.base,
        apiKey: s.apiKey,
        model: (s.model || PRESET_CFG.model).trim().toLowerCase(),
        imgModel: (s.imgModel || PRESET_CFG.imgModel).trim().toLowerCase(),
      };
    }
  } catch (e) {}
  return PRESET_CFG;
}
function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }
window.__aiDiag = [];
function diag(m) { try { window.__aiDiag.push(m); if (window.__aiDiag.length > 8) window.__aiDiag.shift(); } catch (e) {} }
function withTimeout(ms) {
  /* 兼容老内核（部分手机浏览器的 AbortController 缺失）：拿不到就用无超时模式，
     绝不让这里抛错导致整个请求流程崩溃 */
  try {
    if (typeof AbortController === 'undefined') return { signal: undefined, done: function () {} };
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), ms);
    return { signal: c.signal, done: () => clearTimeout(t) };
  } catch (e) { return { signal: undefined, done: function () {} }; }
}
async function aiPost(path, body, ms) {
  const to = withTimeout(ms);
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: to.signal });
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } finally { to.done(); }
}
function extractJson(text) {
  if (!text) return null;
  let t = String(text);
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a === -1 || b <= a) return null;
  t = t.slice(a, b + 1);
  let out = '', inStr = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (c === '"') {
      if (inStr) {
        let j = i + 1; while (j < t.length && /\s/.test(t[j])) j++;
        const nx = t[j];
        if (nx === ',' || nx === ':' || nx === '}' || nx === ']') { inStr = false; out += c; }
        else out += '\\"';
      } else { inStr = true; out += c; }
    } else if (c === '\\' && inStr) { out += c + (t[i + 1] || ''); i++; }
    else out += c;
  }
  try { return JSON.parse(t); } catch (e) {}
  try { return JSON.parse(out); } catch (e) { return null; }
}
async function customChat(system, user, opts) {
  const c = loadCfg();
  const o = opts || {};
  /* 不设时间限制、不切换模型：等待主模型完整输出，保证最高质量。
     180 秒仅为断线保护，正常远用不到 */
  const to = withTimeout(o.ms || 180000);
  try {
    const buildBody = (withThinking) => {
      const body = {
        model: c.model || 'glm-4-flash',
        temperature: (typeof o.temperature === 'number') ? o.temperature : 0.8,
        messages: [{ role: 'system', content: system }, { role: 'user', content: user }],
      };
      /* 思考型模型（glm-5.x / glm-4.5+）才带 thinking 字段；glm-4-flash 等直接请求 */
      if (withThinking) body.thinking = { type: 'enabled', effort: 'high' };
      return body;
    };
    const useThinking = /glm-(5|4\.5|4\.6)/i.test(c.model || '');
    let r = await fetch(c.base.replace(/\/+$/, '') + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.apiKey.trim() },
      body: JSON.stringify(buildBody(useThinking)),
      signal: to.signal });
    if (!r.ok && r.status === 400) {
      /* 旧模型不支持 thinking 字段时自动降级重试一次 */
      diag('chat:HTTP400 去掉thinking重试');
      r = await fetch(c.base.replace(/\/+$/, '') + '/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.apiKey.trim() },
        body: JSON.stringify(buildBody(false)),
        signal: to.signal });
    }
    if (!r.ok) throw new Error('HTTP' + r.status);
    const j = await r.json();
    const t = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
    return t ? String(t) : null;
  } catch (e) { diag('chat:' + (e && e.message)); return null; } finally { to.done(); }
}
async function customImage(prompt) {
  const c = loadCfg();
  if (!c.imgModel) return null;
  const url = c.base.replace(/\/+$/, '') + '/images/generations';
  const wantSize = (c.imgModel || '').indexOf('cogview-4') !== -1;
  /* 依次尝试：尺寸+去水印 → 只带尺寸 → 最简参数（兼容不支持新参数的模型）；
     180 秒仅为断线保护 */
  const decorate = (level, body) => {
    if (level <= 1 && wantSize) body.size = '1344x768';
    if (level === 0) body.watermark_enabled = false;
    return body;
  };
  const to = withTimeout(180000);
  try {
    let lastErr = 'empty';
    for (let level = 0; level < 3; level++) {
      const body = decorate(level, { model: c.imgModel, prompt: prompt });
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.apiKey.trim() },
        body: JSON.stringify(body),
        signal: to.signal });
      if (r.ok) {
        const j = await r.json();
        const u = j && j.data && j.data[0] && j.data[0].url;
        if (u) return u;
      } else {
        lastErr = 'HTTP' + r.status;
        if (r.status !== 400) break;
        diag('img:400 换参数重试(level' + level + ')');
      }
    }
    throw new Error(lastErr);
  } catch (e) { diag('img:' + (e && e.message)); return null; } finally { to.done(); }
}

/* ---------- 提示词：三幕连贯 · 紧扣孩子的开头 ---------- */
const PLAN_ARC_SYS = '你是儿童写作启蒙引导老师"依依老师"，面向4-8岁小朋友。孩子会给你一句故事开头，请把它规划成一个三幕小绘本的完整引导方案。要求：' +
  '1.theme用2到4个字概括开头的场景主题；' +
  '2.三幕必须连成一个连贯的故事：第1幕"发现"（问开头里出现的人/动物/事物正在做什么或是什么样子）、第2幕"行动"（问"你"接下来做了什么，要承上启下）、第3幕"结局"（问"我"的心情或发生一个简单合理的收尾事件，让故事自然结束，最好呼应开头提到的事物）；' +
  '3.重要：第2、3幕的问题本身必须是中性的，不能预设孩子在前一幕选了哪个选项（比如不要写"我们把小鸡带回了家，它现在怎么样了？"这种只在某个选项下才成立的话，应写成"接下来你会做什么呢？""现在是什么心情？"），幕与幕之间的衔接通过goal来引导续写；' +
  '3.每个问题必须直接引用开头里出现过的具体人物、动物、地点或物品的词；每个问题配3个选项，每个不超过12个字，简短具体有画面感，选项必须基于开头里的事物展开，不要引入开头里没有的新角色或新场景，三个选项的感受各不相同（比如：一个开心、一个意外、一个好奇）；' +
  '4.每幕配goal，用一句话说明这一幕要把故事写向哪里、和上一幕怎么衔接；' +
  '5.label是这一幕的章节名，2到4个字（比如"初见小熊猫"可以简写为"初见"）；' +
  '6.语言简单，学龄前孩子能听懂；问题前面不要带"问题1"等前缀；' +
  '7.只输出JSON：{"theme":"主题","acts":[{"label":"章节名","text":"问题","options":["选项1","选项2","选项3"],"goal":"本幕目标"}]}';
const PLAN_SYS = '你是儿童写作启蒙引导老师"依依老师"，面向4-8岁小朋友。根据故事开头设计一个引导问题。要求：' +
  '1.问题必须直接引用开头里出现过的具体人物、动物、地点或物品的词，让问题贴合孩子自己的故事；' +
  '2.配3个选项：要像孩子平时说话那样自然、口语化，读起来就是一句正常的话，直接说"做了什么、看到什么、心情如何"，每个不超过12个字；不要用比喻和书面腔，不要堆砌成语，不要生造词语；' +
  '3.三个选项的方向各不相同（比如：一个开心、一个意外、一个好奇），都基于开头里的事物展开，不要引入开头里没有的新角色或新场景；' +
  '4.问题和选项都要符合现实生活逻辑，不要魔法、会说话的动物等幻想元素；' +
  '5.语言简单，学龄前孩子能听懂；' +
  '6.只输出JSON：{"text":"问题","options":["选项1","选项2","选项3"]}';

const ACT_LABELS = ['相遇', '探索', '圆满'];
function cleanOpt(o) { return String(o).replace(/^(选项\s*[一二三1-9abcABC]|[ABCabc])[：:、.．]\s*/, '').replace(/^[：:、.．\s]+/, '').trim().slice(0, 20); }
function cleanAct(a, idx) {
  if (!a || typeof a.text !== 'string') return null;
  const text = String(a.text).replace(/^(问题\s*[一二三1-9]?\s*[：:、.．]\s*)/, '').trim().slice(0, 40);
  const seen = new Set();
  const options = (Array.isArray(a.options) ? a.options : [])
    .filter((o) => typeof o === 'string' && cleanOpt(o))
    .map(cleanOpt)
    .filter((o) => { if (!o || seen.has(o)) return false; seen.add(o); return true; })
    .slice(0, 3);
  if (!text || options.length < 2) return null;
  const fallbackLabel = ACT_LABELS[idx] || ('第' + (idx + 1) + '幕');
  const label = (typeof a.label === 'string' && a.label.trim()) ? a.label.trim().slice(0, 6) : fallbackLabel;
  const goal = (typeof a.goal === 'string' && a.goal.trim()) ? a.goal.trim().slice(0, 60) : '';
  return { label: label, text: text, options: options, goal: goal };
}
const SLOT_GOALS = [
  '这一幕"发现"：描述开头里的事物正在做什么、什么样子，为故事做铺垫',
  '这一幕"行动"：写"我"做了什么动作，承上启下推动故事发展',

];
async function callPlan(opening) {
  /* 1) 三问并行（每个任务小，思考型模型下也快）；失败的幕自动重试一次 */
  const askSlot = (i) => customChat(PLAN_SYS, '故事开头：' + opening + '\n' + PLAN_SLOTS[i], 26000)
    .then((r) => {
      const a = cleanAct(extractJson(r), i);
      if (a) { a.label = ACT_LABELS[i] || ('第' + (i + 1) + '幕'); a.goal = SLOT_GOALS[i] || ''; }
      return a;
    });
  const rs = await Promise.all([0, 1, 2].map(askSlot));
  const missing = [];
  rs.forEach((r, i) => { if (!r) missing.push(i); });
  if (missing.length) {
    const retry = await Promise.all(missing.map((i) => askSlot(i)));
    retry.forEach((a, k) => { const i = missing[k]; if (a && !rs[i]) rs[i] = a; });
  }
  const seen = new Set();
  const qs = [];
  for (const q of rs) { if (q && !seen.has(q.text)) { seen.add(q.text); qs.push(q); } }
  if (qs.length >= 2) {
    while (qs.length < 3) {
      const i = qs.length; const g = GEN_ACTS[i];
      if (!g) break;
      qs.push({ label: ACT_LABELS[i], text: g.text, options: g.options, goal: SLOT_GOALS[i] || '' });
    }
    return { theme: '', questions: qs.slice(0, 3), engine: 'custom' };
  }
  diag('plan:分幕出题不足(' + qs.length + ')，尝试整体规划');
  /* 2) 整体三幕方案兜底（一次成型但较慢） */
  const t = await customChat(PLAN_ARC_SYS, '故事开头：' + opening);
  const j = extractJson(t);
  if (j && Array.isArray(j.acts)) {
    const acts = j.acts.map((a, i) => cleanAct(a, i)).filter(Boolean).slice(0, 3);
    if (acts.length === 3) {
      const theme = (typeof j.theme === 'string' && j.theme.trim()) ? j.theme.trim().slice(0, 8) : '';
      return { theme: theme, questions: acts, engine: 'custom' };
    }
  }
  diag('plan:三幕方案解析不足');
  /* 3) 同源后端 */
  try {
    const d = await aiPost('/api/story/plan', { opening: opening }, 15000);
    if (d && Array.isArray(d.questions) && d.questions.length >= 2) {
      const qs2 = d.questions.map((q, i) => cleanAct(q, i)).filter(Boolean);
      if (qs2.length >= 2) return { theme: d.theme || '', questions: qs2, engine: 'server' };
    }
  } catch (e) { diag('plan:同源失败 ' + (e && e.message)); }
  return null;
}
function stripEcho(text, opening) {
  let t = String(text || '').trim();
  const o = String(opening || '').trim();
  if (o && t.indexOf(o) === 0) t = t.slice(o.length).trim();
  return t.slice(0, 320);
}
async function callExpand(opening, theme, question, choice, history, isLast, round, goal, prevArt) {
  const user = '故事开头：' + opening +
    (theme ? '\n故事主题：' + theme : '') +
    '\n已经写好的部分：' + (history.join('') || '（这是第一幕，直接接在开头后面写）') +
    '\n本幕问题：' + question +
    (goal ? '\n本幕目标：' + goal : '') +
    '\n小朋友的选择：' + choice +
    (prevArt ? '\n前一幅插画描述（人物的外貌和服装必须沿用，保持前后一致）：' + prevArt : '') +
    (isLast ? '\n（这是最后一幕，请让故事完整、温暖地收尾，呼应开头提到的事物。）' : '\n（这不是最后一幕，不要提前收尾。）');
  /* 偶发解析失败时自动重试一次 */
  let result = null;
  for (let attempt = 0; attempt < 2 && !result; attempt++) {
    if (attempt > 0) await sleep(600);
    const t = await customChat(EXPAND_SYS, user);
    const j = extractJson(t);
    if (j && typeof j.text === 'string' && j.text.trim()) {
      const art = (typeof j.art === 'string' && j.art.trim().length >= 8) ? j.art.trim().slice(0, 130) : '';
      const gems = Array.isArray(j.gems) ? j.gems.map((g) => String(g).trim()).filter(Boolean).slice(0, 3) : [];
      result = { text: j.text.trim(), art: art, gems: gems, engine: 'custom' };
    }
  }
  if (result) return result;
  try {
    const d = await aiPost('/api/story/expand', { opening: opening, question: question, choice: choice, history: history, isLast: isLast, round: round }, 15000);
    if (d && d.text) return { text: d.text, engine: 'server' };
  } catch (e) { diag('expand:同源失败 ' + (e && e.message)); }
  return null;
}
async function callFinish(full) {
  const t = await customChat(FINISH_SYS, '故事内容：' + full.slice(0, 800));
  const j = extractJson(t);
  if (j && j.title && j.praise) return { title: String(j.title).slice(0, 12), praise: String(j.praise).slice(0, 30), engine: 'custom' };

  try {

    if (d && d.title) return { title: d.title, praise: d.praise, engine: 'server' };

}

const GOODWORDS_SYS = '你是儿童写作老师"依依老师"。从一篇小朋友创作的三幕故事里，挑出写得好的情绪表达和好词好句（比如表示开心的"手舞足蹈""眉开眼笑"，表示温暖的"暖洋洋"，象声词"咕噜咕噜"，叠词"亮晶晶"等）。要求：' +
  '1.必须是故事原文里逐字出现的词，不要自己编；' +
  '2.type为"成语"的，必须是《现代汉语词典》里真实收录的四字成语，禁止拼凑生造；' +
  '3.挑4到8个，以四字成语为主，尽量覆盖不同幕；同一个词只输出一次，不要重复；' +
  '4.每个给出：phrase（原文里的词语，2到8个字）、act（出现在第几幕，数字）、type（成语/叠词/象声词/比喻/好词 之一）、emo（这个词表达的情绪，2个字，比如开心/温暖/惊讶/好奇/满足）、tip（一句话夸它好在哪里，不超过14个字）；' +
  '5.只输出JSON：{"items":[{"phrase":"眉开眼笑","act":2,"type":"成语","emo":"开心","tip":"把开心写在了脸上"}]}';
const EMO_MAP = {
  '手舞足蹈': '开心', '眉开眼笑': '开心', '兴高采烈': '开心', '欢天喜地': '开心', '喜出望外': '开心', '乐呵呵': '开心', '笑眯眯': '开心', '美滋滋': '开心', '甜滋滋': '开心',
  '心满意足': '满足', '津津有味': '享受', '狼吞虎咽': '享受', '香气扑鼻': '愉悦', '暖洋洋': '温暖', '毛茸茸': '喜爱', '亮晶晶': '好奇', '慢悠悠': '悠闲', '静悄悄': '安静',
};
const TIP_BY_TYPE = { '成语': '四字好词，表达力满分', '叠词': '叠词让画面活起来', '象声词': '有声音的故事更好听', '比喻': '想象力真丰富', '好词': '用得恰到好处' };
function emoOf(w) { return EMO_MAP[w] || '美好'; }
function classifyWord(w) {
  if (/^(..)\1$/.test(w)) return '象声词';
  if (/^(.)(.)\1\2$/.test(w)) return '叠词';
  if (/^(.)(.)\2$/.test(w)) return '叠词';
  if (/^(.)\1\1$/.test(w)) return '叠词';
  if (w.length === 4) return '成语';
  return '好词';
}
function cleanWord(w, actMax) {
  if (!w || typeof w.phrase !== 'string') return null;
  const phrase = w.phrase.trim().slice(0, 8);
  if (!phrase) return null;
  const types = ['成语', '叠词', '象声词', '比喻', '好词'];
  const type = (typeof w.type === 'string' && types.indexOf(w.type.trim()) !== -1) ? w.type.trim() : classifyWord(phrase);
  let act = parseInt(w.act, 10);
  if (!act || act < 1) act = 1;
  if (actMax && act > actMax) act = actMax;
  const emo = (typeof w.emo === 'string' && w.emo.trim()) ? w.emo.trim().slice(0, 3) : '美好';
  const tip = (typeof w.tip === 'string' && w.tip.trim()) ? w.tip.trim().slice(0, 16) : '用得真棒';
  return { phrase: phrase, act: act, type: type, emo: emo, tip: tip };
}

    '咕噜咕噜', '扑通扑通', '叮叮当当', '吧唧吧唧', '哗啦啦', '滴滴答答'];

const Sound = {
  ctx: null,
  ensure() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
    return this.ctx;
  },
  tone(freq, delay, dur, type, vol) {
    const ctx = this.ensure(); if (!ctx) return;
    try {
      const t0 = ctx.currentTime + delay;
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.08, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) {}
  },
  pop() { if (!S.sound) return; this.tone(660, 0, .1, 'sine', .05); this.tone(880, .06, .1, 'sine', .04); },
  ding() { if (!S.sound) return; this.tone(523, 0, .2, 'sine', .05); this.tone(659, .1, .2, 'sine', .05); this.tone(784, .2, .34, 'sine', .06); },
  turn() { if (!S.sound) return; this.tone(440, 0, .08, 'triangle', .03); },
};

function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function esc2(s) { return esc(s).replace(/'/g, '&#39;').replace(/"/g, '&quot;'); }
function showError(msg) {
  S.err = msg; render();
  setTimeout(() => { if (S.err === msg) { S.err = ''; render(); } }, 3200);

function hlText(text, marks) {
  /* 在转义后的文本里查找所有要标注的词（最长优先、互不重叠），逐个包上彩色 mark */
  const escd = esc(text);
  const list = [];
  (marks || []).forEach((m) => {
    const s = (m && m.s ? String(m.s) : '').trim();
    if (!s || s.length < 2) return;
    const needle = esc(s);
    let idx = 0;
    for (let k = 0; k < 4; k++) {
      const i = escd.indexOf(needle, idx);
      if (i === -1) break;
      list.push({ start: i, end: i + needle.length, cls: m.cls || 'hl-gem' });
      idx = i + needle.length;
    }
  });
  if (!list.length) return escd;
  list.sort((a, b) => (b.end - b.start) - (a.end - a.start));
  const picked = [];
  list.forEach((f) => {
    if (picked.some((e) => f.start < e.end && e.start < f.end)) return;
    picked.push(f);
  });
  picked.sort((a, b) => a.start - b.start);
  let out = '', pos = 0;
  picked.forEach((f) => {
    out += escd.slice(pos, f.start) + '<mark class="' + f.cls + '">' + escd.slice(f.start, f.end) + '</mark>';
    pos = f.end;
  });
  out += escd.slice(pos);
  return out;
}

  const marks = [];
  (page && page.gems ? page.gems : []).forEach((g) => marks.push({ s: g, cls: 'hl-gem' }));
  if (includeChoice && page && page.choice) marks.push({ s: page.choice, cls: 'hl-choice' });
  return marks;
}

function syncSetup() {

async function startStoryAI() {
  const opening = S.opening.trim();
  if (opening.length < 2) { showError('先写一句话开头吧 🧸'); return; }
  S.screen = 'making'; S.step = 'plan'; S.lastChoice = ''; S.theme = '';
  render();
  let plan = null;
  plan = await callPlan(opening);
  let qs = null;
  if (plan) { qs = plan.questions; S.theme = plan.theme || ''; S.engine = plan.engine; }
  if (!qs) { qs = pickQuestions(opening); S.engine = 'local'; S.engineNote = window.__aiDiag.slice(-3).join('；'); }
  S.questions = qs; S.qIndex = 0; S.picked = null; S.pages = []; S.customMode = false;
  S.screen = 'qa';
  render();
}
function selectOption(el, v) {
  S.picked = v;
  const list = el.parentElement;
  if (list) list.querySelectorAll('.choice').forEach((o) => { o.classList.remove('sel'); o.setAttribute('aria-pressed', 'false'); });
  el.classList.add('sel'); el.setAttribute('aria-pressed', 'true');
  const btn = document.getElementById('submitBtn');
  if (btn) btn.disabled = false;
  Sound.pop();
}
function toggleCustom() {
  S.customMode = !S.customMode;
  S.customText = '';

}
function customSend() {
  const v = (S.customText || '').trim();
  if (!v) { showError('先说一句你想写的话吧 ✏️'); return; }
  submitAnswer(v.slice(0, 24));
}
async function submitAnswerAI(override) {
  const choice = (override || S.picked || '').trim();
  if (!choice) return;
  const act = S.questions[S.qIndex] || {};
  const question = act.text || '';
  const isLast = S.qIndex === S.questions.length - 1;
  const round = S.qIndex;
  S.lastChoice = choice;
  S.picked = null; S.customMode = false;
  S.screen = 'making'; S.step = 'write';
  render();

  let text = null;
  const prevArt = S.pages.length ? (S.pages[S.pages.length - 1].art || '') : '';
  const d = await callExpand(S.opening, S.theme, question, choice, S.pages.map((p) => p.text), isLast, round, act.goal || '', prevArt);
  if (d && d.text) { text = stripEcho(d.text, S.opening); S.engine = d.engine; }
  if (!text) {
    text = expandFallback(choice, round, isLast, question);
    S.engine = 'local'; S.engineNote = window.__aiDiag.slice(-3).join('；');
  }
  const page = { text: text, choice: choice, artLoading: true };
  if (d && d.art) page.art = d.art;
  if (d && d.gems && d.gems.length) {
    const seenGem = new Set();
    page.gems = d.gems.filter((g) => {
      if (!g || g.length < 2 || seenGem.has(g) || text.indexOf(g) === -1) return false;
      seenGem.add(g);
      return true;
    }).slice(0, 3);
  }

  /* 正文先展示，插画在后台画，画好后自动补上 —— 体感等待大幅缩短 */
  S.pages.push(page);
  S.lastWasFinal = isLast;
  S.screen = 'page';
  Sound.pop();
  render();

  const actIdx = S.pages.length - 1;
  const artDesc = (page.art || ((text || S.opening) + '，' + choice)).slice(0, 150);
  try {
    const r = await callImage(artDesc, text);
    if (r && r.image) page.image = r.image;
    else if (r && r.svg) page.svg = r.svg;
  } catch (e) {}
  if (!page.image && !page.svg) { page.svg = sceneSvg(artDesc, actIdx + 1); page.artFallback = true; }
  page.artLoading = false;
  if (S.screen === 'page' || S.screen === 'book') render();
}
async function rerollQuestionAI() {
  if (S.rerolling) return;
  S.rerolling = true; render();
  const idx = S.qIndex;
  const prev = S.questions[idx];
  const roleHints = [
    '这一幕是"发现"：问开头里事物的样子或正在做什么',
    '这一幕是"行动"：问"你"接下来做的动作，要承上启下',
    '这一幕是"结局"：问"我"的心情或收尾的小事件',
  ];
  const user = '故事开头：' + S.opening +
    '\n幕次：第' + (idx + 1) + '幕。' + (roleHints[idx] || '') +
    '\n注意：必须和之前的问题与选项完全不同，换一批更有趣、更有画面感的。' +
    '之前的问题：' + (prev ? prev.text : '（无）') + '。之前的选项：' + (prev ? prev.options.join('、') : '（无）') + '。';
  const t = await customChat(PLAN_ONE_SYS, user, 26000);
  const a = cleanAct(extractJson(t), idx);
  S.rerolling = false;
  if (a && a.options.length >= 2) { a.label = prev ? prev.label : (ACT_LABELS[idx] || ''); a.goal = prev ? prev.goal : ''; S.questions[idx] = a; S.picked = null; Sound.pop(); }
  else showError('换一换没成功，再试一次吧 🧸');
  render();
}
function goNext() {
  S.qIndex++; S.picked = null; S.customMode = false; S.screen = 'qa';
  render();
}
async function redrawAI() {
  if (S.redrawing || !S.pages.length) return;
  S.redrawing = true; render();
  const p = S.pages[S.pages.length - 1];
  const desc = (p.art || ((p.text || '') + '，' + (p.choice || ''))).slice(0, 150);
  let done = false;
  try {
    const r = await callImage(desc + '，换一个不同的构图和视角', p.text);
    if (r && r.image) { delete p.svg; p.artFallback = false; p.image = r.image; done = true; }
    else if (r && r.svg) { delete p.image; p.artFallback = false; p.svg = r.svg; done = true; }
  } catch (e) {}
  if (!done) { if (!p.image) { p.svg = sceneSvg(desc, S.pages.length + 7); p.artFallback = true; } showError('这次插画没有生成成功，可以再试一次。'); }
  S.redrawing = false;
  render();
}
function confettiBurst() {
  try {
    const wrap = document.createElement('div');
    wrap.className = 'confetti-wrap';
    const colors = ['#F4623A', '#F5A623', '#2F9E77', '#4E8FD9', '#E5628B', '#8E7CC3'];
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('span');
      p.className = 'cf';
      if (i % 6 === 0) {
        p.textContent = ['⭐', '✨', '🌟'][i % 3];
        p.style.background = 'transparent';
        p.style.width = 'auto';
        p.style.height = 'auto';
        p.style.fontSize = '14px';
      } else {
        p.style.background = colors[i % colors.length];
      }
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDelay = (Math.random() * 0.7) + 's';
      p.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
      wrap.appendChild(p);
    }
    document.body.appendChild(wrap);
    setTimeout(() => { try { wrap.remove(); } catch (e) {} }, 3600);
  } catch (e) {}
}
async function finishBookAI() {
  const full = S.opening + S.pages.map((p) => p.text).join('');
  S.bookMeta = { title: '我的小故事', praise: '你是了不起的小作家！🌟' };
  S.goodWords = [];
  S.bookIdx = 0; S.lastTurn = ''; S.screen = 'book';
  confettiBurst(); Sound.ding();
  render();
  const results = await Promise.all([callFinish(full), callGoodWords(full, S.pages.length)]);
  const d = results[0], g = results[1];
  if (d && d.title) S.bookMeta = { title: d.title, praise: d.praise || S.bookMeta.praise };
  if (g && g.length) S.goodWords = g;

function restart() {
  reset();
  try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
  render();
}
function turn(dir) {
  const total = S.pages.length + 2;
  const ni = Math.max(0, Math.min(total - 1, S.bookIdx + dir));
  if (ni === S.bookIdx) return;
  S.lastTurn = dir < 0 ? 'l' : 'r';
  S.bookIdx = ni;
  Sound.turn();
  render();
}
function jump(i) {
  if (i === S.bookIdx) return;
  S.lastTurn = i < S.bookIdx ? 'l' : 'r';
  S.bookIdx = i;
  Sound.turn();
  render();
}

/* ---------- 事件 ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v || '';
  if (act === 'pick') { selectOption(el, v); return; }
  switch (act) {
    case 'example': fillExample(parseInt(v, 10) || 0); break;
    case 'start': startStory(); break;
    case 'speak': Sound.pop(); speak(v, true); break;
    case 'reroll': rerollQuestion(); break;
    case 'custom': toggleCustom(); break;
    case 'customSend': customSend(); break;
    case 'submit': submitAnswer(); break;
    case 'next': goNext(); break;
    case 'finish': finishBook(); break;
    case 'redraw': redraw(); break;
    case 'new': goHome(); break;
    case 'turn': turn(parseInt(v, 10) || 0); break;
    case 'jump': jump(parseInt(v, 10) || 0); break;
    case 'print': try { window.print(); } catch (err) {} break;
    case 'cfg': openCfg(); break;
    case 'saveCfg': saveCfgFromForm(); break;
    case 'closeCfg': closeCfg(); break;
    case 'testConn': testConn(); break;
  }
});
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('cfgmodal').classList.contains('hidden')) return;
  if (S.screen === 'book') {
    if (e.key === 'ArrowLeft') turn(-1);
    else if (e.key === 'ArrowRight') turn(1);
    return;
  }
  if (S.screen === 'qa' && e.key === 'Enter' && !S.customMode) {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag !== 'TEXTAREA' && tag !== 'INPUT' && S.picked) submitAnswer();
  }
});
let tchX = 0, tchY = 0, tchOk = false;
document.addEventListener('touchstart', (e) => {
  tchOk = !!(e.target.closest && e.target.closest('.bookstage'));
  if (tchOk) { tchX = e.touches[0].clientX; tchY = e.touches[0].clientY; }
}, { passive: true });
document.addEventListener('touchend', (e) => {
  if (!tchOk) return;
  const dx = e.changedTouches[0].clientX - tchX, dy = e.changedTouches[0].clientY - tchY;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) turn(dx < 0 ? 1 : -1);
  tchOk = false;
}, { passive: true });
document.addEventListener('change', (e) => {
  if (e.target.id === 'sndToggle') {
    S.sound = e.target.checked;
    try { localStorage.setItem('gugu-sound', S.sound ? '1' : '0'); } catch (err) {}
    if (S.sound) Sound.pop();
  }
  if (e.target.id === 'ttsToggle') {
    S.tts = e.target.checked;
    try { localStorage.setItem('gugu-tts', S.tts ? '1' : '0'); } catch (err) {}
    if (S.tts) speak('朗读打开啦，依依老师给你读问题');
  }
});

async function testConn() {
  const el = document.getElementById('connResult');
  el.textContent = '⏳ 测试中…';
  const to = withTimeout(12000);
  try {
    const c = { base: document.getElementById('cfgBase').value.trim(), apiKey: document.getElementById('cfgKey').value.trim(), model: document.getElementById('cfgModel').value.trim() };
    if (!c.apiKey) { el.textContent = '请先填写 API Key。'; return; }
    const r = await fetch((c.base || 'https://open.bigmodel.cn/api/paas/v4').replace(/\/+$/, '') + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ((c.apiKey || '') + '').trim() },
      body: JSON.stringify({ model: c.model || 'glm-4-flash', messages: [{ role: 'user', content: '回复：OK' }], max_tokens: 4 }),
      signal: to.signal });
    const t = await r.text();
    el.textContent = r.ok ? '✅ 连接成功' : '❌ HTTP ' + r.status + '：' + t.slice(0, 80);
  } catch (e) {
    el.textContent = '❌ 连不上：' + (e && e.message);
  } finally { to.done(); }
}

  '<div class="create-grid"><section class="composer fadeup"><div class="panel-pad"><div class="composer-top"><label class="label" for="opening"><span class="step-stamp">01</span>今天的故事，从这里开始</label><small>一两句话就够啦</small></div><textarea id="opening" maxlength="100" placeholder="今天，你去了哪里？看到了什么？\n比如：我和妈妈来到企鹅馆，外面突然下雨了。">'+esc(S.opening)+'</textarea><div class="field-meta"><span>一个小发现、一件开心事，都可以写下来。</span><span><b id="ccount">'+S.opening.length+'</b> / 100</span></div><div class="chips no-print"><span class="prompt-hint">找一点灵感</span>'+EXAMPLES.map((e,i)=>'<button class="chip" data-act="example" data-v="'+i+'">'+['🐧 看企鹅','🪁 放风筝','🐰 遇见小兔'][i]+'</button>').join('')+'</div><div class="composer-actions"><button class="btn-primary" id="startBtn" data-act="start"'+(S.opening.trim().length<2?' disabled':'')+'>'+icon('pen')+'开始我的故事'+icon('arrow')+'</button><button class="text-button" data-act="demo">先体验一下 →</button></div><div class="draftnote no-print" id="draftNote" hidden>开头已保存在这个浏览器里，放心慢慢写。</div></div></section><aside class="howto"><h2>'+icon('leaf')+'一个故事，慢慢长大</h2>'+[['写一句小开头','把你的小发现告诉依依。'],['聊三个小问题','选一选，也可以自己说。'],['收获一本小绘本','有画、有故事，还有你的想法。']].map((s,i)=>'<div class="journey-item"><span class="journey-number">0'+(i+1)+'</span><div><b>'+s[0]+'</b><p>'+s[1]+'</p></div></div>').join('')+'<p class="howto-note">依依陪你找灵感，<br>你才是故事的小主人。</p></aside></div><div class="home-bottom"><span>'+icon('audio')+'可以读给你听</span><span>'+icon('heart')+'鼓励自己的表达</span><span>'+icon('book')+'绘本可以打印收藏</span></div>';
}
function viewQA(){
  const act=S.questions[S.qIndex];if(!act)return '';const total=S.questions.length;
  let h='<div class="fadeup">'+progressHTML(S.qIndex+1,total,act.label||'')+recapHTML();
  h+='<div class="ask"><div class="ask-avatar">'+MASCOT_SVG+'</div><div class="ask-bubble"><span class="q">'+esc(act.text)+'</span><div class="ask-tools no-print"><button class="btn-soft" data-act="speak" data-v="'+esc2(act.text)+'" aria-label="读出问题">'+icon('audio')+'读给我听</button><button class="btn-soft accent" data-act="reroll"'+(S.rerolling?' disabled':'')+'>'+icon('refresh')+(S.rerolling?'想新点子…':'换个点子')+'</button><button class="btn-soft" data-act="custom">'+icon('pen')+(S.customMode?'回到选项':'我自己说')+'</button></div></div></div>';
  if(S.customMode)h+='<div class="customrow fadeup"><input id="customAns" aria-label="我自己的想法" maxlength="24" placeholder="把你想到的，写在这里…" value="'+esc2(S.customText||'')+'"/><button class="btn-primary slim" data-act="customSend"'+((S.customText||'').trim()?'':' disabled')+'>写进故事 '+icon('arrow')+'</button></div>';
  else h+='<div class="choices">'+act.options.map((o,i)=>'<button class="choice'+(S.picked===o?' sel':'')+'" aria-pressed="'+(S.picked===o)+'" data-act="pick" data-v="'+esc2(o)+'"><span class="key">'+ACT_KEYS[i]+'</span><span>'+esc(o)+'</span><span class="check" aria-hidden="true">✓</span></button>').join('')+'</div><p class="choice-hint">选一个喜欢的，也欢迎说出你自己的想法。</p><button class="btn-primary" id="submitBtn" data-act="submit"'+(S.picked?'':' disabled')+'>'+(S.qIndex===total-1?'写下我的结局':'把这个想法写进去')+icon('arrow')+'</button>';
  return h+'</div>';
}
function render(){
  let h=topbarHTML();if(S.err)h+='<div class="errbar no-print" role="alert">'+esc(S.err)+'</div>';
  h+='<main class="wrap '+(S.screen==='book'?'book-wrap':S.screen==='setup'?'':'flow-wrap')+'">';
  if(S.screen!=='setup'){
    if(S.demo)h+='<div class="preview-notice no-print">'+icon('book')+'示例体验 · 使用预设文字和插画，不消耗 AI 额度。<button class="text-button" data-act="home" style="margin-left:auto;white-space:nowrap">回到首页</button></div>';
    else if(S.engine==='local')h+='<div class="preview-notice no-print">AI 连接未成功，当前展示本地示意内容。可在家长设置中检查连接。</div>';
    if(S.screen!=='book')h+='<div class="flow-heading no-print"><div><div class="flow-kicker">MY LITTLE STORY · 我的小故事</div><h1>'+(S.screen==='qa'?'让故事，再长大一点。':S.screen==='page'?'看，你的想法变成了故事。':'好故事，值得等一小会儿。')+'</h1><p>'+(S.screen==='qa'?'依依来问，你来决定故事的方向。':S.screen==='page'?'读一读这一页，再去看看接下来会发生什么。':'依依正在把你的想法认真写下来。')+'</p></div>'+MASCOT_SVG+'</div>';
  }
  if(S.screen==='setup')h+=viewSetup();else if(S.screen==='qa')h+=viewQA();else if(S.screen==='making')h+=viewMaking();else if(S.screen==='page')h+=viewPage();else if(S.screen==='book')h+=viewBook();
  h+='<footer class="no-print">依依故事屋 · 陪小小的你，写大大的世界。<span class="footsep">/</span>每个故事，都有你的名字。</footer></main>';app.innerHTML=h;postRender();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='demo')beginDemo(false);if(b.dataset.act==='sample')beginDemo(true);if(b.dataset.act==='home')goHome();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCfg();});
document.getElementById('cfgmodal').addEventListener('click',e=>{if(e.target.id==='cfgmodal')closeCfg();});

let settingsReturnFocus=null;
function openCfg(){settingsReturnFocus=document.activeElement;openCfgOriginal();app.inert=true;document.querySelector('.modal-close').focus();}
function closeCfg(){document.getElementById('cfgmodal').classList.add('hidden');app.inert=false;if(settingsReturnFocus&&settingsReturnFocus.isConnected)settingsReturnFocus.focus();}
document.addEventListener('keydown',e=>{
 const modal=document.getElementById('cfgmodal');if(e.key!=='Tab'||modal.classList.contains('hidden'))return;
 const nodes=Array.from(modal.querySelectorAll('button,input,summary')).filter(el=>!el.disabled&&el.getClientRects().length);
 const first=nodes[0],last=nodes[nodes.length-1];
 if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
 else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});

render();
</script>
</body>
</html>
